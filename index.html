<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AtomSim — quantum atom</title>
</head>
<body>
  <header id="topbar">
    <div class="brand">AtomSim</div>
    <div class="crumb" id="crumb">—</div>
    <div class="status">
      <span class="pill" id="fps">— FPS</span>
      <span class="pill tag" id="exactpill">EXACT</span>
      <span class="pill" id="drawcount">0 draws</span>
    </div>
  </header>

  <aside id="left">
    <div class="sect-label">STATE VECTOR · <span id="stateatom">—</span></div>
    <div class="bigstate" id="statename">—</div>
    <div class="qn" id="qn">—</div>
    <div class="desc" id="statedesc">—</div>
    <div id="props"></div>
    <div class="hist-wrap">
      <div class="sect-label">RADIAL P(r) <span class="pill tag" id="histpill">EXACT</span></div>
      <canvas id="hist" width="252" height="72"></canvas>
    </div>
  </aside>

  <main id="viewport">
    <div class="overlay tl" id="drawlabel">|ψ|² Monte-Carlo · 0 draws</div>
    <div class="overlay bl">
      <span class="pill vis">VISUAL LIBERTY</span>
      <span class="pill vis">MONTE-CARLO</span>
      <span class="annot" id="annot"></span>
    </div>
  </main>

  <aside id="right">
    <section>
      <div class="sect-label">SYSTEM</div>
      <label class="row"><span>element</span><select id="element"></select></label>
    </section>

    <section>
      <div class="sect-label">VIEW MODE</div>
      <div class="btnlist" id="view">
        <button data-v="atom">3D point cloud · atom</button>
        <button data-v="orbital">3D point cloud · orbital</button>
      </div>
    </section>

    <section id="orbSection">
      <div class="sect-label">ORBITAL</div>
      <label class="row"><span>state</span><select id="orbital"></select></label>
    </section>

    <section>
      <div class="sect-label">SAMPLING</div>
      <label class="row"><span>points</span><input id="points" type="range" min="10000" max="200000" step="10000" /></label>
      <label class="row" id="phaseRow"><span>phase colour</span><input id="phase" type="checkbox" /></label>
      <label class="row"><span>auto-rotate</span><input id="rot" type="checkbox" /></label>
      <label class="row"><span>fit view</span><input id="fit" type="checkbox" /></label>
    </section>

    <div class="log" id="log">&gt; ready</div>
  </aside>

  <script type="module" src="/main.ts"></script>
</body>
</html>
